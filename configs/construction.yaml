project:
  run_name: example-python
featurefactory:
  mode: library
  root: ../FeatureFactory
  database_url: postgresql+psycopg://belta_ff:belta_ff@127.0.0.1:55433/belta_ff
  auto_manage_postgres: true
  postgres_container_name: remnantbench-ff-postgres
  postgres_data_dir: data/cache/featurefactory/postgres
repo_discovery:
  name: example-python
  target_repositories:
    - pallets/flask
    - psf/requests
  max_concurrent_partitions: 2
github:
  token_env: GITHUB_TOKEN
candidate_pairs:
  offset_ranges:
    - start: 1
      stop: 200
      step: 1
  max_concurrent_repos: 2
  max_concurrent_repo_downloads: 2
  min_implementation_units: 1
  min_reinsert_source_lines: 5
retire_task_construction:
  max_concurrent_repo_baselines: 2
  max_concurrent_pairs: 2
