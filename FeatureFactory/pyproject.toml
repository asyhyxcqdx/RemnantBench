[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feature-factory"
version = "0.1.0"
description = "FeatureFactory stage1 repository crawler"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.6",
  "jsonschema>=4.26.0",
  "matplotlib>=3.10.0",
  "pandas>=3.0.3",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "watchfiles>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]